services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      # Server type and version
      TYPE: PAPER
      VERSION: ${MC_VERSION:-LATEST}
      EULA: "TRUE"

      # Performance
      MEMORY: ${MEMORY:-4G}
      USE_AIKAR_FLAGS: "true"

      # Server settings
      MOTD: ${SERVER_NAME:-My Minecraft Server}
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      DIFFICULTY: ${DIFFICULTY:-normal}
      GAMEMODE: ${GAMEMODE:-survival}
      ALLOW_FLIGHT: ${ALLOW_FLIGHT:-false}
      LEVEL_SEED: ${LEVEL_SEED:-}

      # Access control
      WHITELIST: ${WHITELIST:-false}
      OPS: ${OPS:-}

      # Quality of life
      ENABLE_COMMAND_BLOCK: "true"
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 10
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 30s
      timeout: 10s
      retries: 3

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: America/Chicago
