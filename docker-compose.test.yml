# v2 TEST server — isolated from the live server in ~/dev/minecraft-endeavours.
# Selected automatically inside the v2 worktree via COMPOSE_FILE in .env, so
# `docker compose …` and scripts/start.sh|stop.sh|console.sh hit only this.
# Different container name, project, port and data dir from the live server.
# See v2/TEST_SERVER.md.
name: mcv2test

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc-v2-test
    restart: "no"
    ports:
      - "127.0.0.1:${MC_PORT:-25566}:25565"
      - "127.0.0.1:${RCON_PORT:-25576}:25575"
    environment:
      TYPE: PAPER
      VERSION: ${MC_VERSION:?MC_VERSION must be pinned}
      EULA: "TRUE"
      MEMORY: ${MEMORY:-2G}
      USE_AIKAR_FLAGS: "true"
      MOTD: "Steve v2 test server"
      DIFFICULTY: ${DIFFICULTY:-normal}
      GAMEMODE: survival
      LEVEL_SEED: ${LEVEL_SEED:-}
      ONLINE_MODE: "false"
      # Loopback-only server; whitelist off so eval players/bots can join freely.
      ENABLE_WHITELIST: "false"
      OPS: ${OPS:-}
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?set RCON_PASSWORD in .env}
      ENABLE_COMMAND_BLOCK: "true"
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 6
      SIMULATION_DISTANCE: 6
      # Scenarios control time/weather explicitly.
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "false"
    volumes:
      - ./data:/data
    healthcheck:
      test: mc-health
      start_period: 3m
      interval: 30s
      timeout: 10s
      retries: 3
